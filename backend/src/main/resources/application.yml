spring:
  application:
    name: sakan
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sakan}
    username: ${SPRING_DATASOURCE_USERNAME:sakan}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
app:
  images:
    root: ${IMAGE_STORAGE_ROOT:./uploads}
  jwt:
    secret: ${JWT_SECRET}   # no default on purpose: the app must fail fast without it
    expiration: 24h
    security:
      login-rate-limit:
        max-attempts: 5
        window-minutes: 15
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
