spring:
  application:
    name: sakan
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sakan}
    username: ${SPRING_DATASOURCE_USERNAME:sakan}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            # Non-secret placeholders keep local startup working; real Google sign-in requires .env values.
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope: openid,profile,email
            redirect-uri: "${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}"
        provider:
          google:
            issuer-uri: https://accounts.google.com
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  images:
    root: ${IMAGE_STORAGE_ROOT:./uploads}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    email: ${ADMIN_EMAIL:}
  jwt:
    secret: ${JWT_SECRET}   # no default on purpose: the app must fail fast without it
    expiration: 24h
    security:
      login-rate-limit:
        max-attempts: 5
        window-minutes: 15
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
