server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for text, JS, CSS, JSON, and SVG assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Reverse-proxy API requests to the Spring Boot `api` service in Docker Compose.
    # Using a variable + Docker's DNS resolver (127.0.0.11) defers DNS lookup to request time
    # so Nginx starts cleanly even before `api` is reachable or when run standalone.
    location /api/ {
        resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google OAuth authorization and callback endpoints live in the Spring API.
    location ~ ^/(?:oauth2|login/oauth2)/ {
        resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache hashed static bundles (JS/CSS/fonts/images) aggressively;
    # keep i18n JSON files and index.html uncached so updates appear immediately.
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular SPA fallback: deep links like /auth or /listings fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
