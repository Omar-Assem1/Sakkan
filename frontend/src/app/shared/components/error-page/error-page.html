<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="max-w-md w-full text-center">

    <!-- Status code badge -->
    <div class="mb-6">
      <span class="text-8xl font-black text-gray-200">{{ error.status }}</span>
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-bold text-gray-800 mb-3">{{ error.title }}</h1>

    <!-- Detail / Reason -->
    @if (error.detail) {
      <p class="text-gray-500 text-sm mb-8 leading-relaxed">{{ error.detail }}</p>
    }
    <!-- Actions -->
    <div class="flex gap-3 justify-center">
      <button
        (click)="goBack()"
        class="px-5 py-2 rounded-lg border border-gray-300 text-sm text-gray-700 hover:bg-gray-100 transition"
      >
        ← Go back
      </button>
      <button
        (click)="goHome()"
        class="px-5 py-2 rounded-lg bg-blue-600 text-white text-sm hover:bg-blue-700 transition"
      >
        Home
      </button>
    </div>

  </div>
</div>
