<div class="relative w-full">
  <div class="relative flex w-full items-center">
    <div
      class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-3.5 text-slate-400 dark:text-slate-500"
    >
      <svg class="h-5 w-5" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
    </div>

    <input
      type="text"
      [value]="query()"
      (input)="onInput($event)"
      [placeholder]="'LISTINGS.SEARCH.PLACEHOLDER' | transloco"
      [attr.aria-label]="'LISTINGS.SEARCH.LABEL' | transloco"
      class="w-full rounded-xl border border-slate-200 bg-white py-2.5 ps-10 pe-10 text-start text-sm text-slate-900 placeholder-slate-400 shadow-2xs transition-all focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 focus:outline-hidden dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:placeholder-slate-500"
    />

    <button
      *ngIf="query().length > 0"
      type="button"
      (click)="clear()"
      [attr.aria-label]="'LISTINGS.SEARCH.CLEAR' | transloco"
      class="absolute inset-y-0 end-0 flex cursor-pointer items-center pe-3 text-slate-400 transition-colors hover:text-slate-600 focus:outline-hidden dark:text-slate-500 dark:hover:text-slate-300"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
