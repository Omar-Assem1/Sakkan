<div class="relative w-full">
  <div class="relative flex items-center w-full">
    <!-- Search Icon (RTL-aware start-0 ps-3.5) -->
    <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none text-slate-400">
      <svg class="w-5 h-5" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>

    <!-- Search Input (RTL-aware ps-10 pe-10 text-start) -->
    <input
      type="text"
      [value]="query()"
      (input)="onInput($event)"
      [placeholder]="'LISTINGS.SEARCH.PLACEHOLDER' | transloco"
      [attr.aria-label]="'LISTINGS.SEARCH.LABEL' | transloco"
      class="w-full py-2.5 ps-10 pe-10 text-sm text-slate-900 bg-white border border-slate-200 rounded-xl shadow-2xs placeholder-slate-400 focus:outline-hidden focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all text-start"
    />

    <!-- Clear Button (RTL-aware end-0 pe-3) -->
    <button
      *ngIf="query().length > 0"
      type="button"
      (click)="clear()"
      [attr.aria-label]="'LISTINGS.SEARCH.CLEAR' | transloco"
      class="absolute inset-y-0 end-0 flex items-center pe-3 text-slate-400 hover:text-slate-600 focus:outline-hidden transition-colors cursor-pointer"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
